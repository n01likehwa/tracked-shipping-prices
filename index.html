<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracked Shipping Prices</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 24px 16px;
        background: #F7F5F1;
        color: #45423F;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
        max-width: 700px;
        margin: 0 auto;
    }

    h1 {
        text-align: center;
        margin-bottom: 8px;
        font-size: 28px;
    }

    .subtitle {
        text-align: center;
        color: #918B84;
        margin-bottom: 24px;
        font-size: 14px;
    }

    .search {
        width: 100%;
        padding: 15px 18px;
        border: 1px solid #E9E5DE;
        border-radius: 14px;
        font-size: 16px;
        outline: none;
        background: white;
        margin-bottom: 18px;
    }

    .search:focus {
        border-color: #BDB5AA;
    }

    #results {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .country {
        background: white;
        border: 1px solid #E9E5DE;
        border-radius: 16px;
        padding: 17px;
    }

    .country-name {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 12px;
    }

    .unavailable {
        color: #A49D94;
        font-style: italic;
    }

    .prices {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
        gap: 8px;
    }

    .price {
        background: #F5F2EC;
        border-radius: 10px;
        padding: 10px;
        text-align: center;
    }

    .weight {
        display: block;
        font-size: 12px;
        color: #918B84;
        margin-bottom: 3px;
    }

    .amount {
        font-weight: 600;
    }

    .hint {
        text-align: center;
        color: #A49D94;
        font-size: 13px;
        margin-top: 20px;
    }

    .notice {
        background: #F0ECE4;
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 18px;
        font-size: 13px;
        color: #716B63;
    }
</style>
</head>

<body>

<div class="container">

    <h1>✈️ Tracked Shipping Prices 📦</h1>

    <div class="subtitle">
        Search your destination below
    </div>

    <div class="notice">
        Prices are listed in SEK and depend on the destination and package weight.
    </div>

    <input
        type="text"
        id="search"
        class="search"
        placeholder="🔎 Search for a country..."
        autocomplete="on"
    >

    <div id="results"></div>

    <div class="hint" id="hint">
        Start typing to search for a country.

</div>

const unavailable = [
    "Israel",
    "North Korea",
    "Russia"
];

const countries = [];

// Create country entries from the groups
Object.values(groups).forEach(group => {
    group.countries.forEach(country => {
        countries.push({
            name: country,
            prices: group.prices
        });
    });
});

// Add unavailable countries
unavailable.forEach(country => {
    countries.push({
        name: country,
        prices: null
    });
});

// Sort alphabetically
countries.sort((a, b) => a.name.localeCompare(b.name));

const search = document.getElementById("search");
const results = document.getElementById("results");
const hint = document.getElementById("hint");

function showResults(query = "") {

    const q = query.trim().toLowerCase();

    if (!q) {
        results.innerHTML = "";
        hint.textContent = "Start typing to search for a country.";
        return;
    }

    const matches = countries.filter(country =>
        country.name.toLowerCase().includes(q)
    );

    results.innerHTML = "";

    if (matches.length === 0) {
        hint.textContent = "No country found 😭";
        return;
    }

    hint.textContent =
        matches.length === 1
            ? "1 country found"
            : `${matches.length} countries found`;

    matches.forEach(country => {

        const card = document.createElement("div");
        card.className = "country";

        let html = `
            <div class="country-name">
                ${country.name}
            </div>
        `;

        if (!country.prices) {

            html += `
                <div class="unavailable">
                    ❌ Tracked shipping is currently unavailable.
                </div>
            `;

        } else {

            html += `<div class="prices">`;

            Object.entries(country.prices).forEach(([weight, price]) => {

                html += `
                    <div class="price">
                        <span class="weight">${weight}</span>
                        <span class="amount">${price}</span>
                    </div>
                `;

            });

            html += `</div>`;
        }

        card.innerHTML = html;
        results.appendChild(card);
    });
}

search.addEventListener("input", () => {
    showResults(search.value);
});
